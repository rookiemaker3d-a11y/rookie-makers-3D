# Rookie Makers 3D - Producción en VPS (Hostinger, DigitalOcean, etc.)
# Uso: docker compose --env-file .env up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rookie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-produccion}
      POSTGRES_DB: rookie_erp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rookie -d rookie_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    # Ollama es opcional (IA); el ERP y el login no dependen de él. Arranca ollama aparte si lo necesitas.
    environment:
      DATABASE_URL: postgresql+asyncpg://rookie:${POSTGRES_PASSWORD:-cambiar-en-produccion}@db:5432/rookie_erp
      SECRET_KEY: ${SECRET_KEY:-cambiar-secret-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Notificaciones por correo (Gmail SMTP)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      # Mercado Pago (suscripciones)
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_SUCCESS_URL: ${MP_SUCCESS_URL:-}
      MP_FAILURE_URL: ${MP_FAILURE_URL:-}
      MP_PENDING_URL: ${MP_PENDING_URL:-}
      # Variables reservadas para integración WhatsApp/API (fase 1)
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ALERT_TO: ${WHATSAPP_ALERT_TO:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      # Persistir archivos subidos (cotizaciones, etc.) en el servidor
      - backend_uploads:/app/uploads
      # Persistir web-assets subidos desde el ERP (Editor web)
      - web_assets:/app/web-assets
    expose:
      - "8000"
    # Localhost: Vite (npm run dev) proxy a la API. Si 8002 esta ocupado, define BACKEND_HOST_PORT en .env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8002}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    # El puerto 80 del host suele estar ocupado (nginx de Hostinger, otro sitio). Acceso: http://TU_IP:8080  y  /app/  /api/
    # Si liberas el 80 y quieres usarlo: FRONTEND_HOST_PORT=80 en .env  (y en Vercel apunta /api al mismo host:puerto)
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"

  # n8n self-hosted (sin mensualidad SaaS)
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # Puerto público del host = N8N_HOST_PORT (5678 suele estar ocupado en el VPS). Ajusta WEBHOOK_URL en .env a http://TU_IP:15678/
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:15678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-cambiar-en-produccion-32-chars-minimo}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Mexico_City}
      # BD de n8n en PostgreSQL (contenedor db compartido)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: rookie_erp
      DB_POSTGRESDB_USER: rookie
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-en-produccion}
      # Auth básica para panel n8n (recomendado)
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-cambiar-n8n-password}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    volumes:
      - n8n_data:/home/node/.n8n
    # Host 15678 → contenedor 5678 (evita choque con otro n8n/servicio en 5678). Cambia con N8N_HOST_PORT en .env
    ports:
      - "${N8N_HOST_PORT:-15678}:5678"

  # Ollama self-hosted (modelos locales). El backend usa http://ollama:11434 dentro de la red Docker.
  # No publicamos 11434 en el host: en muchos VPS ya hay Ollama nativo u otro servicio en 127.0.0.1:11434 y Docker falla al levantar.
  # Para usar la API desde el host: docker compose exec ollama ollama list  ;  o añade bajo ollama:  ports: ["127.0.0.1:11435:11434"]
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  backend_uploads:
  web_assets:
  n8n_data:
  ollama_data:
